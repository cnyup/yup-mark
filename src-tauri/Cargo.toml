[package]
name = "yupmark"
version = "0.3.0"
description = "An open-source, Typora-like WYSIWYG Markdown editor built on CodeMirror 6"
authors = ["cnyup"]
license = "MIT"
repository = "https://github.com/cnyup/yup-mark"
edition = "2021"

# 大整数版本见 tauri.conf.json（两处需同步）

[lib]
name = "yupmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
notify = "8"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
