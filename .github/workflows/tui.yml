name: TUI

on:
  push:
    branches: [main]
    paths:
      - 'packages/tui/**'
      - 'packages/live-cm/**'
      - '.github/workflows/tui.yml'
  pull_request:
    paths:
      - 'packages/tui/**'
      - 'packages/live-cm/**'
      - '.github/workflows/tui.yml'
  workflow_dispatch:

jobs:
  test-build-smoke:
    name: ${{ matrix.os }} · test + build + smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Headless smoke (pure Node)
        run: node packages/tui/scripts/headless-smoke.mjs

      - name: Unit tests
        run: npm test

      - name: Build dist bundle
        run: node packages/tui/scripts/build-dist.mjs

      - name: Smoke the bundle (non-TTY preview)
        shell: bash
        run: |
          if ! node packages/tui/dist/cli.mjs samples/m3-demo.md > preview.txt 2> preview-err.txt; then
            echo "::error::cli exited nonzero: $(head -c 400 preview-err.txt)"
            exit 1
          fi
          for pat in "M3" "用户" "打开 YupMark"; do
            if ! grep -q "$pat" preview.txt; then
              echo "::error::pattern missing in preview: $pat"
              echo "::error::preview head: $(head -c 500 preview.txt | tr '\n' ' ')"
              exit 1
            fi
          done
          rm -f preview.txt preview-err.txt

      - name: Verify bin resolution (npx)
        shell: bash
        run: |
          cd packages/tui
          npm pack --silent
          mkdir -p /tmp/tui-install && cd /tmp/tui-install
          npm init -y >/dev/null
          TGZ=$(ls "$GITHUB_WORKSPACE"/packages/tui/yupmark-tui-*.tgz | head -1)
          npm install "$TGZ" --no-audit --no-fund
          npx yupmark "$GITHUB_WORKSPACE/samples/m3-demo.md" | grep -q "M3"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: yupmark-tui-${{ matrix.os }}
          path: packages/tui/dist/cli.mjs
          if-no-files-found: error
