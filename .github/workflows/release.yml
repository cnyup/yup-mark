name: release

# 统一发版：推 v* 标签 → 三平台桌面安装包 + TUI npm tarball → 同一 GitHub Release。
# 双线版本锁步：tag v0.3.0 要求 tauri.conf 与 packages/tui 均为 0.3.0（tui job 内校验）。
# npm 官方源发布保持手动（cd packages/tui && npm publish），与本流水线不冲突。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # universal dmg：rustup 无 universal target，需装双架构由 tauri lipo 合并
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin
            artifact: macos-dmg
            artifact-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            build-args: ''
            artifact: windows-nsis
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            build-args: ''
            artifact: linux-appimage-deb
            artifact-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install npm deps
        run: npm install

      - name: Build（测试 → renderer → tauri bundle）
        run: |
          npm test
          npx tauri build ${{ matrix.build-args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  tui:
    name: TUI tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match TUI package version（双线版本锁步）
        run: |
          TAGVER="${GITHUB_REF_NAME#v}"
          PKGVER=$(node -p "require('./packages/tui/package.json').version")
          if [ "$TAGVER" != "$PKGVER" ]; then
            echo "::error::tag $GITHUB_REF_NAME != packages/tui version $PKGVER（统一发版要求两线版本一致）"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build dist bundle
        run: node packages/tui/scripts/build-dist.mjs

      - name: Smoke the bundle (non-TTY preview)
        run: |
          node packages/tui/dist/cli.mjs samples/m3-demo.md > /tmp/tui-preview.txt
          grep -q "打开 YupMark" /tmp/tui-preview.txt   # 流程图字符画
          grep -q "用户" /tmp/tui-preview.txt            # 时序图字符画

      - name: Pack tarball
        run: |
          cd packages/tui
          npm pack --silent
          mv yupmark-tui-*.tgz "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tui-tarball
          path: yupmark-tui-*.tgz
          if-no-files-found: error

  release:
    needs: [build, tui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate-release-notes: true
          files: bundles/*
