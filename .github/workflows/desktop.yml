name: desktop-ci

# Tauri 桌面线 CI：Node 侧（lint/typecheck/test）+ Rust 侧（fmt/clippy/test）+ Linux 打包验证
# 完整三平台安装包走 desktop-release.yml（tag v*）
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'packages/live-cm/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'packages/live-cm/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install npm deps
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Tauri build（Linux：AppImage + deb 打包链路验证）
        run: npx tauri build

  # macOS 编译检查：捕获平台签名分叉（如 PredefinedMenuItem::about 在 mac 是 3 参），
  # ubuntu 单平台 verify 抓不到这类错误；只 check 不打包
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check（debug，无需前端产物）
        working-directory: src-tauri
        run: cargo check
